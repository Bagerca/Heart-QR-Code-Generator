<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart QR Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 0, 50, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #ff0033; margin-top: 0; }
        
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            width: 65%;
            outline: none;
            font-size: 16px;
        }
        
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background-color: #d9002b; transform: scale(1.05); }

        canvas {
            max-width: 100%;
            height: auto;
            /* Легкая тень, чтобы сердце "парило" */
            filter: drop-shadow(0 10px 20px rgba(255, 0, 60, 0.25));
        }
        
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Heart QR Art ❤️</h1>
    
    <div class="input-group">
        <input type="text" id="qr-text" value="I LOVE YOU" placeholder="Текст или ссылка">
        <button onclick="generateArtQR()">Создать</button>
    </div>

    <canvas id="qrCanvas" width="600" height="560"></canvas>
    
    <div class="footer">Кликните правой кнопкой мыши по сердцу, чтобы скачать</div>
</div>

<script>
    function drawHeartPath(ctx, x, y, width, height) {
        ctx.beginPath();
        const topCurveHeight = height * 0.3;
        ctx.moveTo(x, y + topCurveHeight);
        ctx.bezierCurveTo(x, y, x - width / 2, y, x - width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x - width / 2, y + (height + topCurveHeight) / 2, x, y + height, x, y + height);
        ctx.bezierCurveTo(x, y + height, x + width / 2, y + (height + topCurveHeight) / 2, x + width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x + width / 2, y, x, y, x, y + topCurveHeight);
        ctx.closePath();
    }

    // Функция рисования круглой точки
    function drawDot(ctx, x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        // Рисуем круг (radius = size / 2)
        // Умножаем на 0.85, чтобы между точками был маленький зазор (воздух)
        const radius = (size / 2) * 0.85; 
        ctx.arc(x + size/2, y + size/2, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // Функция рисования квадрата с сильным скруглением (для "глаз" QR кода)
    function drawRoundedBox(ctx, x, y, size, color) {
        ctx.fillStyle = color;
        const r = size * 0.35; // Радиус скругления
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, r);
        ctx.fill();
    }

    function generateArtQR() {
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        const text = document.getElementById('qr-text').value;
        
        const W = canvas.width;
        const H = canvas.height;
        const mainColor = "#ff0033"; 

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        // --- ГЕОМЕТРИЯ ---
        const heartW = 540;
        const heartH = 500;
        const heartX = W / 2;
        const heartY = 30;

        // Генерация QR
        const qr = qrcode(0, 'H'); // 'H' - высокий уровень коррекции, код плотнее и красивее
        qr.addData(text);
        qr.make();
        const moduleCount = qr.getModuleCount();
        
        // Размер модуля (точки) подбираем так, чтобы код занимал разумное место
        const qrPixelSize = 13; // Фиксированный размер точки для четкости
        const qrMatrixSizePixels = moduleCount * qrPixelSize;
        
        // Позиция QR (смещение вниз в широкую часть)
        const startX = (W - qrMatrixSizePixels) / 2;
        const startY = heartY + (heartH * 0.22); // Чуть выше центра масс

        // --- ЛОГИКА ЕДИНОЙ СЕТКИ ---
        // Мы будем рисовать точки по всей площади сердца, используя ту же сетку, что и у QR
        
        // 1. Создаем маску сердца (Clip)
        ctx.save();
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.clip();

        // Расширяем сетку на весь холст
        // Вычисляем, сколько точек влезает в холст
        const cols = Math.ceil(W / qrPixelSize);
        const rows = Math.ceil(H / qrPixelSize);

        // Определяем границы QR кода в координатах сетки
        // Находим, с какой колонки/строки начинается QR код
        const qrStartCol = Math.floor(startX / qrPixelSize);
        const qrStartRow = Math.floor(startY / qrPixelSize);
        
        // Зона тишины (отступ в блоках)
        const quietPadding = 2; 

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = c * qrPixelSize;
                const y = r * qrPixelSize;

                // Проверяем, попадает ли текущая точка внутрь зоны QR кода (включая рамку тишины)
                const inQrZoneX = (c >= qrStartCol - quietPadding) && (c < qrStartCol + moduleCount + quietPadding);
                const inQrZoneY = (r >= qrStartRow - quietPadding) && (r < qrStartRow + moduleCount + quietPadding);
                const inQrZone = inQrZoneX && inQrZoneY;

                if (inQrZone) {
                    // --- МЫ ВНУТРИ ЗОНЫ QR ---
                    
                    // Вычисляем координаты внутри QR матрицы
                    const qrR = r - qrStartRow;
                    const qrC = c - qrStartCol;

                    // Если мы в "зоне тишины" (рамка), ничего не рисуем (оставляем белым)
                    if (qrR < 0 || qrC < 0 || qrR >= moduleCount || qrC >= moduleCount) {
                        continue; 
                    }

                    // Если это сам модуль данных
                    if (qr.isDark(qrR, qrC)) {
                        // Проверка: это часть "Глаза" (большого квадрата)?
                        // Глаза находятся в углах: (0,0), (0, конец), (конец, 0)
                        // Размер глаза обычно 7x7 модулей
                        const isEye = (qrR < 7 && qrC < 7) || 
                                      (qrR < 7 && qrC >= moduleCount - 7) || 
                                      (qrR >= moduleCount - 7 && qrC < 7);
                        
                        if (isEye) {
                            // Глаза рисуем квадратиками, чтобы сканер лучше цеплялся
                            // Но чуть скруглим их
                             // Рисуем не по модулям, а просто заливаем (чуть ниже), 
                             // здесь просто ставим флаг или рисуем как есть.
                             // Проще нарисовать просто точку, но чуть крупнее
                             ctx.fillStyle = mainColor;
                             ctx.fillRect(x, y, qrPixelSize + 0.5, qrPixelSize + 0.5);
                        } else {
                            // Данные рисуем красивыми КРУЖОЧКАМИ
                            drawDot(ctx, x, y, qrPixelSize, mainColor);
                        }
                    }
                } else {
                    // --- МЫ СНАРУЖИ (ФОН) ---
                    // Рисуем декоративные точки
                    // Вероятность появления точки (плотность фона)
                    if (Math.random() > 0.65) {
                        // Используем drawDot, чтобы стиль совпадал с кодом
                        drawDot(ctx, x, y, qrPixelSize, "#ff0033"); 
                    }
                }
            }
        }
        ctx.restore(); // Снимаем обрезку сердца

        // 2. Рисуем контур сердца поверх
        ctx.save();
        ctx.lineWidth = 12;
        ctx.strokeStyle = mainColor;
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.stroke();
        ctx.restore();
    }

    window.onload = generateArtQR;
</script>

</body>
</html>
