<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart QR Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 0, 50, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #ff0033; margin-top: 0; }
        
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            width: 65%;
            outline: none;
            font-size: 16px;
        }
        
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background-color: #d9002b; transform: scale(1.05); }

        canvas {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(255, 0, 0, 0.2));
        }
        
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Heart QR Generator ❤️</h1>
    
    <div class="input-group">
        <input type="text" id="qr-text" value="Я тебя люблю" placeholder="Ваш текст или ссылка...">
        <button onclick="generateArtQR()">Создать</button>
    </div>

    <canvas id="qrCanvas" width="600" height="560"></canvas>
    
    <div class="footer">Кликните правой кнопкой мыши по сердцу, чтобы скачать</div>
</div>

<script>
    // Функция рисования контура сердца
    function drawHeartPath(ctx, x, y, width, height) {
        ctx.beginPath();
        const topCurveHeight = height * 0.3;
        ctx.moveTo(x, y + topCurveHeight);
        ctx.bezierCurveTo(x, y, x - width / 2, y, x - width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x - width / 2, y + (height + topCurveHeight) / 2, x, y + height, x, y + height);
        ctx.bezierCurveTo(x, y + height, x + width / 2, y + (height + topCurveHeight) / 2, x + width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x + width / 2, y, x, y, x, y + topCurveHeight);
        ctx.closePath();
    }

    // Функция для рисования скругленного прямоугольника (подложка под QR)
    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    function generateArtQR() {
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        const text = document.getElementById('qr-text').value;
        
        const W = canvas.width;
        const H = canvas.height;
        const mainColor = "#ff0033"; 
        
        // Очистка
        ctx.clearRect(0, 0, W, H);
        // Белый фон на весь холст (чтобы при сохранении не было черного фона)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        // --- ГЕОМЕТРИЯ ---
        const heartW = 520;
        const heartH = 480;
        const heartX = W / 2;
        const heartY = 40; 

        // Генерация QR данных
        const qr = qrcode(0, 'M'); 
        qr.addData(text);
        qr.make();
        const moduleCount = qr.getModuleCount();
        
        const qrSize = 240; 
        const pixelSize = qrSize / moduleCount;

        // Позиция QR (смещена вниз)
        const startX = (W - qrSize) / 2;
        const startY = heartY + (heartH * 0.25);

        // --- 1. РИСУЕМ СПЛОШНОЕ СЕРДЦЕ И ШУМ ---
        ctx.save();
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.clip(); // Работаем только внутри сердца

        // Рисуем шум везде
        const cellSize = 12; 
        for (let y = 0; y < H; y += cellSize) {
            for (let x = 0; x < W; x += cellSize) {
                if (Math.random() > 0.45) {
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(x, y, cellSize, cellSize);
                }
            }
        }
        ctx.restore();

        // --- 2. ЖИРНАЯ ОБВОДКА СЕРДЦА ---
        ctx.save();
        ctx.lineWidth = 14;
        ctx.strokeStyle = mainColor;
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.stroke();
        ctx.restore();

        // --- 3. "ВЫРЕЗАЕМ" МЕСТО ПОД QR ---
        // Рисуем белый скругленный квадрат поверх шума.
        // Это и есть Quiet Zone, которая делает код читаемым.
        const padding = 25; // Увеличил отступ для надежности
        const bgSize = qrSize + (padding * 2);
        const bgX = startX - padding;
        const bgY = startY - padding;
        const borderRadius = 35; // Сильное скругление, чтобы было мягко

        ctx.fillStyle = "#ffffff";
        drawRoundedRect(ctx, bgX, bgY, bgSize, bgSize, borderRadius);
        ctx.fill();

        // Опционально: можно добавить ОЧЕНЬ тонкую обводку вокруг белой зоны, 
        // если хочется четкости, но вы просили незаметный переход, поэтому оставим чисто белым.
        // Если сканируется плохо, раскомментируйте строки ниже:
        /*
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#ffe6e9"; // Очень бледный розовый
        ctx.stroke();
        */

        // --- 4. РИСУЕМ САМ QR ---
        ctx.fillStyle = mainColor;
        for (let row = 0; row < moduleCount; row++) {
            for (let col = 0; col < moduleCount; col++) {
                if (qr.isDark(row, col)) {
                    // Рисуем точки
                    // Можно рисовать их кружочками, чтобы сочеталось со скругленной подложкой
                    const px = startX + col * pixelSize;
                    const py = startY + row * pixelSize;
                    
                    // Вариант А: Квадраты (классика, лучше читается)
                    ctx.fillRect(px, py, pixelSize + 0.5, pixelSize + 0.5);

                    // Вариант Б (экспериментальный): Кружочки (более стильнo)
                    /*
                    ctx.beginPath();
                    ctx.arc(px + pixelSize/2, py + pixelSize/2, pixelSize/2, 0, Math.PI*2);
                    ctx.fill();
                    */
                }
            }
        }
    }

    window.onload = generateArtQR;
</script>

</body>
</html>
