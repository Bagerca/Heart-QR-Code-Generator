<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart QR Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 0, 50, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #ff0033; margin-top: 0; }
        
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            width: 65%;
            outline: none;
            font-size: 16px;
        }
        
        button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background-color: #d9002b; transform: scale(1.05); }

        canvas {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(255, 0, 0, 0.2));
        }
        
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Heart QR Generator ❤️</h1>
    
    <div class="input-group">
        <input type="text" id="qr-text" value="Я тебя люблю" placeholder="Ваш текст или ссылка...">
        <button onclick="generateArtQR()">Создать</button>
    </div>

    <canvas id="qrCanvas" width="600" height="560"></canvas>
    
    <div class="footer">Кликните правой кнопкой мыши по сердцу, чтобы скачать</div>
</div>

<script>
    function drawHeartPath(ctx, x, y, width, height) {
        ctx.beginPath();
        const topCurveHeight = height * 0.3;
        ctx.moveTo(x, y + topCurveHeight);
        ctx.bezierCurveTo(x, y, x - width / 2, y, x - width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x - width / 2, y + (height + topCurveHeight) / 2, x, y + height, x, y + height);
        ctx.bezierCurveTo(x, y + height, x + width / 2, y + (height + topCurveHeight) / 2, x + width / 2, y + topCurveHeight);
        ctx.bezierCurveTo(x + width / 2, y, x, y, x, y + topCurveHeight);
        ctx.closePath();
    }

    function generateArtQR() {
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        const text = document.getElementById('qr-text').value;
        
        const W = canvas.width;
        const H = canvas.height;
        const mainColor = "#ff0033"; 
        
        // Очистка холста (делает его белым/прозрачным)
        ctx.clearRect(0, 0, W, H);
        // Заливаем фон белым явно, чтобы при сохранении картинки не было прозрачности
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0, W, H);

        // --- 1. ПРЕДВАРИТЕЛЬНЫЙ РАСЧЕТ ПОЗИЦИИ QR ---
        // Нам нужно знать где будет QR до того, как мы начнем рисовать фон,
        // чтобы не рисовать "шум" под ним.
        
        const qr = qrcode(0, 'M'); 
        qr.addData(text);
        qr.make();
        const moduleCount = qr.getModuleCount();
        const qrSize = 240; 
        const pixelSize = qrSize / moduleCount;

        // Геометрия сердца
        const heartW = 520;
        const heartH = 480;
        const heartX = W / 2;
        const heartY = 40; 

        // Позиция QR (смещена вниз на 25% высоты сердца)
        const startX = (W - qrSize) / 2;
        const startY = heartY + (heartH * 0.25);

        // Определяем "Запретную зону" для шума.
        // Это область QR кода + небольшой отступ (Quiet Zone), который обязан быть белым.
        const quietZone = 20; // Обязательный белый отступ для сканера
        const forbiddenX1 = startX - quietZone;
        const forbiddenX2 = startX + qrSize + quietZone;
        const forbiddenY1 = startY - quietZone;
        const forbiddenY2 = startY + qrSize + quietZone;

        // --- 2. РИСУЕМ ФОН (ШУМ) ---
        ctx.save();
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.clip(); // Обрезаем все по форме сердца

        const cellSize = 12; 
        for (let y = 0; y < H; y += cellSize) {
            for (let x = 0; x < W; x += cellSize) {
                
                // ГЛАВНОЕ ИЗМЕНЕНИЕ: Пропускаем рисование, если мы внутри зоны QR
                if (x > forbiddenX1 && x < forbiddenX2 && y > forbiddenY1 && y < forbiddenY2) {
                    continue; 
                }

                if (Math.random() > 0.45) {
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(x, y, cellSize, cellSize);
                }
            }
        }
        ctx.restore(); 

        // --- 3. ОБВОДКА СЕРДЦА ---
        ctx.save();
        ctx.lineWidth = 14;
        ctx.strokeStyle = mainColor;
        drawHeartPath(ctx, heartX, heartY, heartW, heartH);
        ctx.stroke();
        ctx.restore();

        // --- 4. РИСУЕМ QR КОД ---
        // Мы НЕ рисуем белый прямоугольник с рамкой.
        // Мы просто рисуем сами пиксели кода. Белый фон под ними уже есть (от очистки холста).
        
        ctx.fillStyle = mainColor;
        for (let row = 0; row < moduleCount; row++) {
            for (let col = 0; col < moduleCount; col++) {
                if (qr.isDark(row, col)) {
                    // Рисуем пиксели
                    // pixelSize + 0.6 делает их чуть жирнее, чтобы не было щелей
                    ctx.fillRect(
                        startX + col * pixelSize, 
                        startY + row * pixelSize, 
                        pixelSize + 0.6, 
                        pixelSize + 0.6
                    );
                }
            }
        }
    }

    window.onload = generateArtQR;
</script>

</body>
</html>
